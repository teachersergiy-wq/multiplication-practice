# Local / CI Supabase configuration for multiplication-practice.
# Does not target production project bvetbqbxjrvrmdhszmcw.
#
# MERGE NOTE: after G3+G4+G6, final config must list ALL functions with verify_jwt = true:
#   provision-teacher, create-students, reset-student-password, delete-student
#   get-assessment-draft, upsert-question, delete-question, reorder-questions
#   publish-assessment, clone-assessment
#   start-attempt, submit-answer, finish-attempt

project_id = "multiplication-practice"

[api]
enabled = true
port = 54321
# Do not expose private schema via PostgREST (review #6).
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
minimum_password_length = 6
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[functions.provision-teacher]
verify_jwt = true

[functions.create-students]
verify_jwt = true

[functions.reset-student-password]
verify_jwt = true

[functions.delete-student]
verify_jwt = true

[functions.start-attempt]
verify_jwt = true

[functions.submit-answer]
verify_jwt = true

[functions.finish-attempt]
verify_jwt = true
